<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0369a1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>CCF Demi-fond & Marche · Lycée Alain 2026</title>
<style>
:root{
  --z:1;
  --bg:#f0f9ff; --card:#fff; --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8; --line:#bae6fd; --soft:#f8fafc;
  --brand:#0284c7; --brand2:#38bdf8; --sel:#0284c7; --selbg:#e0f2fe; --rowact:#f0f9ff;
  --ok:#059669; --okbg:#d1fae5; --mid:#0284c7; --midbg:#e0f2fe; --low:#d97706; --lowbg:#fef3c7;
  --bad:#dc2626; --badbg:#fee2e2; --warn:#ea580c; --warnbg:#ffedd5;
  --head:#0369a1; --headcalc:#1e293b; --overlay:rgba(15,23,42,.55);
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme=dark]{
  --bg:#070d1a; --card:#0f1a2e; --ink:#f8fafc; --ink2:#cbd5e1; --ink3:#8396b0; --line:#2a3b57; --soft:#15233b;
  --brand:#38bdf8; --sel:#38bdf8; --selbg:#082f49; --rowact:#12243f;
  --ok:#6ee7b7; --okbg:#064e3b; --mid:#7dd3fc; --midbg:#0c4a6e; --low:#fde68a; --lowbg:#78350f;
  --bad:#fecaca; --badbg:#7f1d1d; --warn:#fed7aa; --warnbg:#7c2d12;
  --head:#020617; --headcalc:#1e293b; --overlay:rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(13.5px*var(--z))}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
input,select,textarea{font:inherit;color:inherit}
svg{display:block;flex-shrink:0}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}

.top{flex:none;background:linear-gradient(135deg,#0369a1,#0284c7 70%,#38bdf8 150%);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(5px + env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 5px max(10px,env(safe-area-inset-left))}
:root[data-theme=dark] .top{background:#020617;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.logo{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;flex:none}
.titles h1{margin:0;font-size:15px;font-weight:800;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.titles p{margin:1px 0 0;font-size:10.5px;opacity:.85;font-weight:600;white-space:nowrap}
.hstats{display:flex;gap:6px;flex:1;justify-content:center;align-items:center;min-width:0}
.hs{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:2px 9px;line-height:1.15;text-align:center}
.hs span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.06em;opacity:.82;font-weight:800}
.hs b{font-size:15px;font-variant-numeric:tabular-nums}
.hs small{font-size:10px;opacity:.8;font-weight:600}
.bkchip{height:30px;padding:0 9px;border-radius:99px;font-size:11.5px;font-weight:800;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);white-space:nowrap}
.hbtns{display:flex;gap:5px;flex:none}
.hbtn{min-width:34px;height:34px;padding:0 6px;border-radius:9px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.26);display:grid;place-items:center;color:#fff;font-weight:800;font-size:12.5px;transition:.12s}
.hbtn:active{transform:scale(.93);background:rgba(255,255,255,.28)}

.tabs{flex:none;display:flex;align-items:center;gap:6px;background:var(--card);border-bottom:1px solid var(--line);padding:5px max(10px,env(safe-area-inset-right)) 5px max(10px,env(safe-area-inset-left))}
.tabs-scroll{flex:1;display:flex;gap:5px;align-items:center;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs-scroll::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:9px;background:var(--soft);border:1.5px solid var(--line);font-weight:800;font-size:13px;color:var(--ink2);white-space:nowrap}
.tab span.t{overflow:hidden;text-overflow:ellipsis}
.tab b{font-size:10.5px;background:var(--card);border-radius:99px;padding:2px 6px;color:var(--ink2);font-variant-numeric:tabular-nums;flex:none}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme=dark] .tab.on{color:#041320}
.tab.on b{background:rgba(255,255,255,.26);color:inherit}
.tab.ok b{background:var(--okbg);color:var(--ok)}
.tab-add{flex:none;width:34px;height:34px;border-radius:9px;background:var(--soft);border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--brand);font-weight:800;font-size:18px;transition:.12s}
.tab-add:hover{background:var(--selbg);border-color:var(--brand)}
.tabs-r{display:flex;gap:5px;flex:none}
.pillbtn{height:34px;padding:0 11px;border-radius:9px;background:var(--soft);border:1.5px solid var(--line);font-weight:800;font-size:12.5px;color:var(--ink2);display:inline-flex;align-items:center;gap:5px}
.pillbtn.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.pillbtn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
:root[data-theme=dark] .pillbtn.pri{color:#041320}

.gridwrap{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--card)}
.grid{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:1rem}
.grid th{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;font-size:.63rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;height:2.2rem;padding:0 .2rem;border-right:1px solid rgba(255,255,255,.16);line-height:1.1}
.grid th.th-calc{background:var(--headcalc)}
.grid td{height:2.75rem;padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);background:var(--card);text-align:center;font-family:var(--mono);font-size:.98rem;font-weight:700;overflow:hidden;white-space:nowrap;cursor:pointer;scroll-margin-top:2.6rem;scroll-margin-left:14rem;scroll-margin-bottom:1rem}
.grid tbody tr:nth-child(even) td{background:var(--soft)}
.grid tr.act td{background:var(--rowact)!important}
.grid .s0{position:sticky;left:0;z-index:4;font-family:var(--sans);color:var(--ink2);font-size:.85rem}
.grid .s1{position:sticky;left:2.2rem;z-index:4;text-align:left;font-family:var(--sans);padding:0 .5rem;box-shadow:2px 0 0 var(--line);font-size:.92rem;font-weight:800}
.grid th.s0,.grid th.s1{z-index:7}
.grid th.s1{text-align:left;padding-left:.5rem}
.nm-t{display:block;overflow:hidden;text-overflow:ellipsis}
td.sel{outline:3px solid var(--sel);outline-offset:-3px;background:var(--selbg)!important;color:var(--ink)}
td.bad{color:var(--bad);background:var(--badbg)!important}
td.miss{background:var(--warnbg)!important}
td.miss::after{content:"•••";color:var(--warn);font-size:.8rem;letter-spacing:2px}
td.dis{background:#f1f5f9!important;color:var(--ink3)!important;cursor:not-allowed!important}
:root[data-theme=dark] td.dis{background:#1e293b!important;color:#64748b!important}
.caret{display:inline-block;width:2px;height:1.15em;background:var(--sel);vertical-align:-.2em;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
td.calc{color:var(--ink2);font-weight:600}
td.calc.ec{color:var(--ink)}
td.n-hi{background:var(--okbg)!important;color:var(--ok);font-size:1.1rem;font-weight:800}
td.n-mid{background:var(--midbg)!important;color:var(--mid);font-size:1.1rem;font-weight:800}
td.n-lo{background:var(--lowbg)!important;color:var(--low);font-size:1.1rem;font-weight:800}
tr.off td{color:var(--ink3)}
tr.off td.s1{text-decoration:line-through;text-decoration-color:var(--ink3)}
.gp{display:inline-block;min-width:1.5rem;padding:.1rem .28rem;border-radius:.4rem;font-family:var(--sans);font-weight:800;font-size:.8rem}
.gp.G{background:#e0f2fe;color:#0369a1}.gp.F{background:#fce7f3;color:#be185d}
:root[data-theme=dark] .gp.G{background:#0c4a6e;color:#e0f2fe}:root[data-theme=dark] .gp.F{background:#831843;color:#fce7f3}
.ev{display:inline-block;padding:.1rem .35rem;border-radius:.4rem;font-family:var(--sans);font-weight:800;font-size:.72rem;background:var(--midbg);color:var(--mid)}
.ev.e-C250{background:var(--okbg);color:var(--ok)}.ev.e-M250{background:var(--lowbg);color:var(--low)}
.opt-chip{display:inline-block;padding:.08rem .32rem;border-radius:.4rem;font-family:var(--mono);font-weight:800;font-size:.72rem;background:#f3e8ff;color:#7e22ce;border:1px solid #d8b4fe}
:root[data-theme=dark] .opt-chip{background:#3b0764;color:#e9d5ff;border-color:#6b21a8}
.stt{display:inline-block;padding:.1rem .32rem;border-radius:.4rem;font-family:var(--sans);font-weight:800;font-size:.72rem;background:var(--badbg);color:var(--bad)}
.stt.DISP{background:var(--lowbg);color:var(--low)}.stt.INAP{background:var(--warnbg);color:var(--warn)}
.dash{color:var(--ink3)}
.cadd{color:var(--ink3)}.cdot{color:var(--brand)}
.emptyrow{height:9rem!important;font-family:var(--sans)!important;font-weight:600!important;color:var(--ink2);cursor:default!important;background:var(--card)!important}

.kp{flex:none;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -8px 20px -10px rgba(0,0,0,.25);padding:.35rem max(.6rem,env(safe-area-inset-right)) calc(.35rem + env(safe-area-inset-bottom)) max(.6rem,env(safe-area-inset-left));display:flex;flex-direction:column;gap:.3rem;position:relative;z-index:20;transition:transform .2s}
.kp.minimized{transform:translateY(calc(100% - 24px));padding-bottom:0}
.kp-toggle{position:absolute;right:14px;top:-22px;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:7px 7px 0 0;font-size:10.5px;font-weight:800;color:var(--ink2);padding:1px 8px;cursor:pointer;display:flex;align-items:center;gap:4px;box-shadow:0 -2px 5px rgba(0,0,0,.08)}
.kp-row1{display:flex;gap:.3rem;align-items:stretch}
.kp-info{width:12rem;flex:none;background:var(--soft);border:1px solid var(--line);border-radius:.7rem;padding:.2rem .5rem;display:flex;flex-direction:column;justify-content:center;min-width:0}
.kp-info small{font-size:.65rem;color:var(--ink2);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp-info b{font-family:var(--mono);font-size:1.35rem;line-height:1.1;letter-spacing:.02em}
.kp-digits{flex:1;display:grid;grid-template-columns:repeat(11,1fr);gap:.3rem}
.k{height:2.9rem;border-radius:.7rem;background:var(--soft);border:1px solid var(--line);font-weight:800;font-size:1.35rem;color:var(--ink);display:grid;place-items:center;transition:.08s}
.k:active{transform:scale(.94);background:var(--selbg)}
.k.ok{width:5rem;background:linear-gradient(135deg,#0284c7,#0369a1);color:#fff;border:0;font-size:1.2rem}
.k.bs{width:3.8rem;background:var(--lowbg);color:var(--low);font-size:1.2rem}
.kp-row2{display:flex;gap:.3rem;align-items:center;overflow-x:auto;scrollbar-width:none}
.kp-row2::-webkit-scrollbar{display:none}
.k.s{height:2.3rem;min-width:2.8rem;padding:0 .5rem;font-size:.9rem;flex:none;white-space:nowrap}
.k.s.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.k.s.q{background:var(--selbg);color:var(--ink)}
.k.s.dn{background:var(--badbg);color:var(--bad)}
.sep{width:1px;height:1.5rem;background:var(--line);flex:none;margin:0 .2rem}
.kp.shake .kp-info{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(max-width:860px){.kp-row1{flex-wrap:wrap}.kp-info{width:100%}.kp-digits{grid-template-columns:repeat(6,1fr);flex-basis:60%}.hstats{display:none}}

#overlay{position:fixed;inset:0;z-index:100;background:var(--overlay);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center}
#overlay.show{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:620px;max-height:92vh;max-height:92dvh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.8,.2,1);overflow:hidden;font-size:14px}
.sheet.wide{max-width:920px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 0;flex:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px;flex:none}
.sheet-h h2{margin:0;font-size:17.5px;letter-spacing:-.02em}
.sheet-b{padding:6px 16px calc(18px + env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch}
@media(min-width:700px){#overlay{align-items:center}.sheet{border-radius:22px;max-height:88vh}}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink3)}
.icon-btn:active{background:var(--soft);color:var(--ink)}
.field{margin-bottom:11px}
.field>label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin-bottom:5px}
.inp,.sel{width:100%;height:44px;border-radius:11px;border:1.5px solid var(--line);background:var(--soft);padding:0 12px;font-size:14.5px;outline:none}
.inp:focus,.sel:focus{border-color:var(--brand2);background:var(--card);box-shadow:0 0 0 3px rgba(2,132,199,.15)}
textarea.inp{height:auto;padding:10px 12px;font-size:14.5px;line-height:1.4}
.seg{display:flex;background:var(--soft);border-radius:11px;padding:3px;gap:3px;border:1px solid var(--line)}
.seg button{flex:1;height:36px;border-radius:8px;font-weight:700;font-size:13px;color:var(--ink2);transition:.15s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(15,23,42,.15)}
.btn{height:46px;border-radius:12px;font-weight:800;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:.15s}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(135deg,var(--brand2),#0369a1);color:#fff}
.btn.sec{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.dan{background:var(--badbg);color:var(--bad)}
.btn.xl{background:linear-gradient(135deg,#0284c7,#0369a1);color:#fff}
.btn.pdf{background:linear-gradient(135deg,#f43f5e,#be123c);color:#fff}
.stack{display:flex;flex-direction:column;gap:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu-i{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px;border-radius:13px;transition:.12s}
.menu-i:active{background:var(--soft)}
.menu-i .ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--midbg);color:var(--mid);flex:none}
.menu-i b{display:block;font-size:14.5px}
.menu-i small{color:var(--ink2);font-size:12px}
.hint{font-size:12px;color:var(--ink2);line-height:1.45;margin:0 0 10px}
.sec-t{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);margin:12px 0 6px}
.srow{display:flex;gap:7px;align-items:center;margin-bottom:7px}
.srow .inp{height:42px}
.srow .icon-btn{background:var(--soft);flex:none}
.bt{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px}
.bt th{background:var(--card);text-align:left;font-family:var(--sans);font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);padding:4px 3px;border-bottom:2px solid var(--line)}
.bt td{padding:3px 3px;border-bottom:1px solid var(--soft)}
.bt td:first-child{font-weight:800;color:var(--brand)}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:700px){.bgrid{grid-template-columns:1fr}}
.regs{display:flex;flex-wrap:wrap;gap:5px}
.regs span{background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:3px 7px;font-size:11.5px}
.regs b{font-family:var(--mono)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin-bottom:7px}
.tog b{display:block;font-size:14px}.tog small{color:var(--ink2);font-size:11.5px}
.sw{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:.2s}
.sw.on{background:#059669}.sw.on::after{left:22px}
#toast{position:fixed;left:50%;bottom:calc(8.8rem + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--card);padding:9px 15px;border-radius:11px;font-weight:700;font-size:13.5px;z-index:200;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;box-shadow:0 12px 28px -10px rgba(0,0,0,.45)}
#toast.show{opacity:1;transform:translate(-50%,0)}

#print-report{display:none;font-family:var(--sans);color:#0f172a}
.pr-block{break-before:page}
.pr-block:first-child{break-before:auto}
.pr-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #0284c7;padding-bottom:5px;margin-bottom:7px}
.pr-head h1{margin:0;font-size:17px;color:#0369a1}
.pr-head p{margin:2px 0 0;font-size:10.5px;color:#475569}
.pr-meta{text-align:right;font-size:10.5px;line-height:1.5}
.pr-kpis{display:flex;gap:7px;margin-bottom:7px}
.pr-kpis div{flex:1;background:#f0f9ff;border:1px solid #bae6fd;border-radius:6px;padding:4px 7px;font-size:9.5px;color:#0369a1}
.pr-kpis b{display:block;font-size:14.5px;color:#0369a1}
.pr-t{width:100%;border-collapse:collapse;font-size:8.8px;margin-bottom:5px}
.pr-t th{background:#0369a1;color:#fff;font-weight:800;padding:4px 2px;border:1px solid #0284c7;text-align:center;font-size:8px}
.pr-t th.c{background:#1e293b;border-color:#0f172a}
.pr-t td{padding:3px 2px;border:1px solid #cbd5e1;text-align:center}
.pr-t td.l{text-align:left;font-weight:700}
.pr-t td.cm{text-align:left;font-size:8px;color:#475569}
.pr-t tr{break-inside:avoid}
.pr-t tbody tr:nth-child(even){background:#f8fafc}
.pr-t td.cu{background:#f1f5f9;font-weight:700}
.pr-t td.nt{font-weight:800;font-size:10.5px}
.pr-t td.nt.hi{background:#d1fae5;color:#065f46}.pr-t td.nt.mid{background:#e0f2fe;color:#075985}.pr-t td.nt.lo{background:#fef3c7;color:#92400e}
.pr-t td.st{color:#dc2626;font-weight:800}
.pr-sign{margin-top:16px;display:flex;justify-content:space-between;font-size:10.5px;color:#475569;break-inside:avoid}
.pr-sign div{width:44%;border-top:1px solid #94a3b8;padding-top:4px}
.pr-foot{margin-top:5px;font-size:8px;color:#94a3b8;text-align:center}
@media print{
  @page{size:A4 landscape;margin:8mm}
  html,body{background:#fff!important;height:auto;overflow:visible}
  #app,#overlay,#toast{display:none!important}
  #print-report{display:block}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* Écran d'accès enseignant — verrouillage visuel uniquement */
#login-gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:22px;background:radial-gradient(circle at 20% 15%,#0ea5e9 0,#075985 38%,#0f172a 100%);color:#0f172a}
#login-gate[hidden]{display:none!important}
.login-card{width:min(100%,390px);background:#fff;border-radius:24px;padding:30px 26px;box-shadow:0 24px 70px rgba(0,0,0,.3);text-align:center}

      console.warn("Firebase offline:", error);
      onDataLoaded(null, null);
    });

    if (isRemoteUpdate) return;
    const dbRef = ref(db, 'evaluation_ccf_2026');
    set(dbRef, {
      students: studentsData,
      seriesList: seriesData,
      updatedAt: Date.now()
    }).catch(err => console.error("Erreur Firebase:", err));

function perfPoints(best, g, ev){
  if(!best) return null;
  if(ev === 'C250'){
    const t0 = g === 'F' ? 50 : 41;
    const diff = best - t0;
    if(diff <= 0) return 12;
    return Math.max(0, +(12 - diff * 0.22).toFixed(2));
  }
  if(ev === 'M250'){
    const t0 = g === 'F' ? 100 : 90;
    const diff = best - t0;
    if(diff <= 0) return 12;
    return Math.max(0, +(12 - diff * 0.16).toFixed(2));
  }
  const arr = g === 'F' ? PERF_F : PERF_G;
  const i = Math.max(0, best - PERF_T0);
  return i < arr.length ? arr[i] : 0;
}

function parseTime(input){
  if(input===null||input===undefined||input==='')return null;
  if(typeof input==='number')return input>0?Math.round(input):null;
  const s=String(input).trim().replace(/["”″]/g,'').replace(/\s+/g,'');
  if(!s)return null;
  let v=null,m=s.match(/^(\d+)[':mh.,](\d{1,2})$/i);
  if(m){const sec=m[2].length===1?(+m[2])*10:+m[2];v=sec<60?(+m[1])*60+sec:null}
  else if(/^\d{3,4}$/.test(s)){const min=+s.slice(0,-2),sec=+s.slice(-2);v=sec<60?min*60+sec:null}
  else if(/^\d{1,2}$/.test(s))v=+s;
  return v&&v>0?v:null;
}
function fmt(t){

function calc(st){
  const e={n:0,best:null,worst:null,total:null,ecart:null,reg:null,perf:null,afl1:null,note20:null,done:false};
  const arr=[st.t1,st.t2,st.t3].filter(v=>v>0);
  e.n=arr.length;
  if(st.status)return e;

  if(e.n){
    e.best=Math.min(...arr);
    e.worst=Math.max(...arr);
  }
  if(e.n>=2){
    e.ecart=e.worst-e.best;
  }
  if(e.n===3){
    e.done=true;
    e.total=arr[0]+arr[1]+arr[2];
    e.reg=regPoints(e.ecart);
    e.perf=perfPoints(e.best,st.gender,st.event);
    if(e.perf!==null&&e.reg!==null){
      e.afl1=(e.perf+e.reg)/2;
      if(st.afl2!==null && !isNaN(st.afl2)){
        e.note20 = Math.min(20, +(e.afl1 + st.afl2).toFixed(2));
      }
    }
  }
  return e;
}

    if(s) cls+=' sel';
    const inner=(s&&buf!=='')?buf+'<i class="caret"></i>':(v!==null?fr1(v):(s?'<i class="caret"></i>':''));
    return `<td class="${cls}" data-f="${f}">${inner}</td>`;
  }

  const v=st[f],main=(f==='t1'||f==='t2'||f==='t3');
  let cls='tc';
  if(s) cls+=' sel';
  if(main&&v&&(v<MIN_T||v>MAX_T)) cls+=' bad';
  if(main&&!v&&r.n>0&&r.n<3&&!st.status) cls+=' miss';
  const inner=(s&&buf!=='')?fmtBuf(buf)+'<i class="caret"></i>':(v?fmt(v):(s?'<i class="caret"></i>':''));
  return `<td class="${cls}" data-f="${f}">${inner}</td>`;
}

function rowHTML(st,idx){
  const r=calc(st),off=!!st.status,act=sel&&sel.id===st.id;
  const c=(k,inner,cls='')=>`<td class="${cls}" data-f="${k}">${inner}</td>`;
  const dash='<span class="dash">–</span>';
  const afl1Cell=r.afl1!==null?fr1(r.afl1):'';
  const afl1Cls=r.afl1!==null?tier12(r.afl1):'';
  const note20Cell=r.note20!==null?fr1(r.note20):'';
  const note20Cls=r.note20!==null?tier20(r.note20):'';

  return `<tr id="r${st.id}" data-id="${st.id}" class="${off?'off ':''}${act?'act':''}">`+
    c('idx',idx+1,'s0')+
    c('name',`<span class="nm-t">${esc(st.name)}</span>`,'s1')+
    c('gender',`<span class="gp ${st.gender}">${st.gender}</span>`)+
    c('event',`<span class="ev e-${st.event}">${EVS[st.event]}</span>`)+
    c('status',st.status?`<span class="stt ${st.status}">${STAT[st.status]}</span>`:dash)+
    c('afl2_opt',`<span class="opt-chip">${st.afl2_opt}</span>`)+
    tCell(st,'afl2',r)+
    tCell(st,'ann1',r)+tCell(st,'t1',r)+tCell(st,'t2',r)+tCell(st,'t3',r)+
    c('total',r.total?fmt(r.total):'','calc')+
    c('best',r.best?fmt(r.best):'','calc')+
    c('worst',r.worst&&r.n>1?fmt(r.worst):'','calc')+
    c('ecart',r.ecart!==null?`${r.ecart}s`:'','calc ec')+
    c('perf',r.perf!==null?fr1(r.perf):'','calc')+
    c('reg',r.reg!==null?r.reg:'','calc')+
    c('afl1',afl1Cell,'calc '+afl1Cls)+
    c('note20',note20Cell,'calc '+note20Cls)+
    c('com',st.com?`<span class="cdot">${ic('msg',18)}</span>`:`<span class="cadd">${ic('plus',15)}</span>`)+
  '</tr>';
}

  const body=list.length?list.map((st,i)=>rowHTML(st,i)).join(''):
    `<tr><td colspan="${COLS.length}" class="emptyrow">${students.some(s=>s.seriesId===curSeries)?'Tous les élèves de cette série sont complets ✔':'Aucun élève dans cette série — touchez « + Élève » ou importez une liste (Menu).'}</td></tr>`;
  const g=$('grid');g.style.width=TOTALW+'rem';g.innerHTML=colg+thead+'<tbody>'+body+'</tbody>';
}

function refreshStats(){
  const l=students.filter(s=>s.seriesId===curSeries);let done=0,sum=0,cnt=0;
  l.forEach(s=>{
    const r=calc(s);
    if(r.done) done++;
    let val = r.note20 !== null ? r.note20 : (r.afl1 !== null ? (r.afl1 * 20 / 12) : null);
    if(val!==null){sum+=val;cnt++;}
  });
  $('st-done').textContent=done;$('st-of').textContent='/'+l.filter(s=>!s.status).length;
  $('st-avg').textContent=cnt?fr1(sum/cnt):'–';
}

}

let kpMinimized = false;
function toggleKp(){

function setField(st,f,val){
  const old=st[f];if(old===val)return;
  undoStack.push({id:st.id,f,old,ts:st.ts[f]||0});if(undoStack.length>300)undoStack.shift();
  st[f]=val;st.ts[f]=Date.now();dirty++;save();
  updateRow(st);refreshStats();renderTabs();
}
function undo(){
  flush();const u=undoStack.pop();if(!u){toast('Rien à annuler');return}
  const st=byId(u.id);if(!st)return;
  st[u.f]=u.old;st.ts[u.f]=Date.now();dirty++;save();
  if(st.seriesId!==curSeries){curSeries=st.seriesId;renderAll()}
  if(TIMEF.includes(u.f)){sel={id:st.id,f:u.f};buf=''}
  renderAll();reveal();toast('Dernière saisie annulée');
}

function selectCell(id,f){
  const st=byId(id);
  if(f==='ann1' && st && st.event==='C500'){
    return;
  }

  if(!flush())return;
  sel={id,f};buf='';
  document.querySelectorAll('td.sel').forEach(t=>{t.classList.remove('sel');if(t.querySelector('.caret'))t.innerHTML=t.innerHTML.replace(/<i class="caret"><\/i>/,'')});
  document.querySelectorAll('tr.act').forEach(t=>t.classList.remove('act'));
  const tr=$('r'+id);if(tr){tr.classList.add('act');const td=tr.querySelector(`td[data-f="${f}"]`);if(td){td.classList.add('sel');if(!td.textContent.trim())td.innerHTML='<i class="caret"></i>'}}
  
  if(kpMinimized) toggleKp();
  paintKp();reveal();
}

function reveal(){
  if(!sel)return;const td=document.querySelector(`#r${sel.id} td[data-f="${sel.f}"]`);
  if(td&&td.scrollIntoView)td.scrollIntoView({block:'nearest',inline:'nearest'});
}
function paintCell(){
  if(!sel)return;const td=document.querySelector(`#r${sel.id} td[data-f="${sel.f}"]`);
  const st=byId(sel.id);if(td&&st){
    if(sel.f==='afl2'){
      td.innerHTML=buf!==''?buf+'<i class="caret"></i>':(st.afl2!==null?fr1(st.afl2):'<i class="caret"></i>');
    } else {
      td.innerHTML=buf!==''?fmtBuf(buf)+'<i class="caret"></i>':(st[sel.f]?fmt(st[sel.f]):'<i class="caret"></i>');
    }
  }
}
function paintKp(){
  const lab=$('kp-lab'),val=$('kp-val');
  $('k-dir').textContent=prefs.dir==='down'?'Sens ↓':'Sens →';
  $('k-auto').classList.toggle('on',!!prefs.auto);
  if(!sel){lab.textContent='Touchez une cellule';val.textContent='–';return}
  const st=byId(sel.id);if(!st){sel=null;return paintKp()}
  lab.textContent=`${st.name} · ${LABEL[sel.f]}`;
  if(sel.f==='afl2'){
    val.textContent=buf!==''?buf:(st.afl2!==null?fr1(st.afl2):'––');
  } else {
    val.textContent=buf!==''?fmtBuf(buf):(st[sel.f]?fmt(st[sel.f]):'––');
  }
}
function shake(){const k=$('kp');k.classList.remove('shake');void k.offsetWidth;k.classList.add('shake')}

function flush(){
  if(!sel||buf==='')return true;
  const st=byId(sel.id);
  if(!st){buf='';return true}

  if(sel.f==='afl2'){
    let num = Number(buf.replace(',', '.'));
    if(isNaN(num) || num < 0 || num > 12){
      shake();toast('Note AFL2 invalide : '+buf);return false;
    }
    buf='';setField(st,sel.f,num);return true;
  }

  const sec=parseTime(buf);
  if(sec===null){shake();toast('Temps invalide : '+fmtBuf(buf)+' (secondes < 60)');return false}
  buf='';setField(st,sel.f,sec);return true;
}
function rowsNav(){return visibleStudents()}

function advance(){
  if(!sel)return;
  const list=rowsNav().filter(s=>!s.status),i=list.findIndex(s=>s.id===sel.id),f=sel.f;
  if(prefs.dir==='down'){
    let nxt=null;
    for(let j=i+1; j<list.length; j++){
      if(f!=='ann1' || list[j].event!=='C500'){
        nxt=list[j];
        break;
      }
    }
    if(nxt)return selectCell(nxt.id,f);

    const order=['ann1','t1','t2','t3','afl2'],k=order.indexOf(f);
    if(k>=0&&k<order.length-1&&list.length){
      const nextField=order[k+1];
      toast(`Colonne ${LABEL[f]} terminée → ${LABEL[nextField]}`);
      const firstValid=list.find(s=>nextField!=='ann1' || s.event!=='C500') || list[0];
      return selectCell(firstValid.id,nextField);
    }
    toast('Fin de la colonne ✔');paintKp();return;
  }
  
  const curSt=byId(sel.id);
  const seq=curSt && curSt.event==='C500'?['t1','t2','t3','afl2']:['ann1','t1','t2','t3','afl2'];
  const k=seq.indexOf(f);
  if(k>=0 && k<seq.length-1)return selectCell(sel.id,seq[k+1]);
  
  const nxt=list[i+1];
  if(nxt){
    const startField=nxt.event==='C500'?'t1':'ann1';
    return selectCell(nxt.id,startField);
  }
  toast('Fin de la série ✔');
}

function kDigit(d){
  if(!sel){toast('Touchez d’abord une cellule');return}
  if(sel.f==='afl2'){
    if(d==='.'){
      if(buf.includes('.')) return;
      buf = (buf===''?'0':buf) + '.';
    } else {
      if(buf.length>=4)return;
      buf+=d;
    }
    paintCell();paintKp();
    return;
  }
  if(d==='.') return;
  if(buf.length>=4)return;
  buf+=d;paintCell();paintKp();
  if(prefs.auto&&buf.length===3)kOk();
}
function kBack(){if(!sel)return;buf=buf.slice(0,-1);paintCell();paintKp()}
function kOk(){
  if(!sel){toast('Touchez d’abord une cellule');return}
  if(buf===''){advance();return}
  if(!flush())return;
  advance();
}
function kClear(){
  if(!sel)return;const st=byId(sel.id);buf='';
  if(st&&st[sel.f]!==null&&st[sel.f]!==undefined){setField(st,sel.f,null);paintKp()}else{paintCell();paintKp()}
}
function kMove(dx,dy){
  if(!sel)return;if(!flush())return;
  const list=rowsNav(),i=list.findIndex(s=>s.id===sel.id);
  let f=sel.f,id=sel.id;
  if(dx){
    const st=byId(sel.id);
    const validFields=st&&st.event==='C500'?['t1','t2','t3','afl2']:TIMEF;
    let k=validFields.indexOf(f)+dx;
    if(k<0||k>=validFields.length)return;
    f=validFields[k];
  }
  if(dy){
    const n=list[i+dy];
    if(!n)return;
    id=n.id;
    if(f==='ann1' && n.event==='C500') f='t1';
  }
  selectCell(id,f);
}
function kQuick(n){
  if(!sel){toast('Touchez d’abord une cellule');return}
  const st=byId(sel.id);if(!st)return;
  if(sel.f==='afl2'){
    let cur = st.afl2 || 0;
    setField(st, 'afl2', Math.max(0, Math.min(12, +(cur + n*0.5).toFixed(1))));
    paintKp();paintCell();return;
  }
  let base=buf!==''?parseTime(buf):st[sel.f];
  if(!base){
    const list=rowsNav(),i=list.findIndex(s=>s.id===sel.id);
    for(let j=i-1;j>=0;j--){if(list[j][sel.f]){base=list[j][sel.f];break}}
  }
  if(!base){toast('Pas de valeur de départ : saisissez un temps');return}
  buf='';setField(st,sel.f,Math.max(1,base+n));paintKp();paintCell();
}
function toggleDir(){prefs.dir=prefs.dir==='down'?'row':'down';save();paintKp();toast(prefs.dir==='down'?'Sens : de haut en bas (une colonne à la fois)':'Sens : de gauche à droite (élève par élève)')}
function toggleAuto(){prefs.auto=!prefs.auto;save();paintKp();toast(prefs.auto?'Validation automatique après 3 chiffres':'Validation avec ✓ OK uniquement')}

$('grid').addEventListener('click',e=>{
  const td=e.target.closest('td');if(!td||!td.dataset.f)return;
  const tr=td.parentNode,st=byId(+tr.dataset.id);if(!st)return;
  const f=td.dataset.f;
  if(TIMEF.includes(f)){
    if(f==='ann1' && st.event==='C500') return;
    return selectCell(st.id,f);
  }
  if(!flush())return;
  if(f==='gender')return setField(st,'gender',st.gender==='G'?'F':'G');
  if(f==='event'){
    const nextEv = EVORD[(EVORD.indexOf(st.event)+1)%EVORD.length];
    setField(st,'event',nextEv);
    if(nextEv==='C500' && sel && sel.id===st.id && sel.f==='ann1'){
      selectCell(st.id,'t1');
    }
    return;
  }
  if(f==='afl2_opt'){
    const nextOpt = OPTS_AFL2[(OPTS_AFL2.indexOf(st.afl2_opt)+1)%OPTS_AFL2.length];
    setField(st,'afl2_opt',nextOpt);
    return;
  }
  if(f==='status')return setField(st,'status',STORD[(STORD.indexOf(st.status)+1)%4]);
  if(f==='com')return openComment(st.id);
  if(f==='name'||f==='idx')return openStudentSheet(st.id);
  document.querySelectorAll('tr.act').forEach(t=>t.classList.remove('act'));tr.classList.add('act');
});

$('kp-digits').innerHTML=[1,2,3,4,5,6,7,8,9,0,'.'].map(d=>`<button class="k" onclick="kDigit('${d}')">${d==='.'?',':d}</button>`).join('');
document.addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test((e.target||{}).tagName))return;
  if($('overlay').classList.contains('show'))return;
  if(/^[\d.,]$/.test(e.key))kDigit(e.key===','?'.':e.key);
  else if(e.key==='Backspace')kBack();
  else if(e.key==='Enter')kOk();
  else if(e.key==='ArrowLeft')kMove(-1,0);else if(e.key==='ArrowRight')kMove(1,0);
  else if(e.key==='ArrowUp'){e.preventDefault();kMove(0,-1)}else if(e.key==='ArrowDown'){e.preventDefault();kMove(0,1)}
});

const ZOOMS=[.85,.92,1,1.1,1.2,1.35];
function applyPrefs(){
  document.documentElement.style.setProperty('--z',prefs.z);
  document.documentElement.dataset.theme=prefs.theme;
  const b=$('btn-theme');b.innerHTML=ic(prefs.theme==='dark'?'sun':'moon',18);

function zoom(d){
  let i=ZOOMS.findIndex(z=>Math.abs(z-prefs.z)<.01);if(i<0)i=2;
  i=Math.max(0,Math.min(ZOOMS.length-1,i+d));prefs.z=ZOOMS[i];save();applyPrefs();reveal();
}
function toggleTheme(){prefs.theme=prefs.theme==='dark'?'light':'dark';save();applyPrefs()}

function setDraft(k,v,btn){draft[k]=v;[...btn.parentNode.children].forEach(b=>b.classList.toggle('on',b===btn))}
function saveDraft(){
  const name=$('f-name').value.trim();
  if(!name){toast('Saisissez un nom');$('f-name').focus();return}
  const afl2Input = $('f-afl2').value.trim();
  const afl2Val = afl2Input!==''? Number(afl2Input.replace(',', '.')) : null;
  if(afl2Val!==null && (!Number.isFinite(afl2Val) || afl2Val<0 || afl2Val>12)){
    toast('La note AFL 2 doit être comprise entre 0 et 12');
    $('f-afl2').focus();
    return;
  }

  if(draft.id){
    const st=byId(draft.id),now=Date.now();
    [['name',name],['gender',draft.gender],['event',draft.event],['status',draft.status],['afl2_opt',draft.afl2_opt],['afl2',afl2Val]].forEach(([k,v])=>{if(st[k]!==v){st[k]=v;st.ts[k]=now}});
    st.seriesId=draft.seriesId;
  }else{
    const now=Date.now(),ts={name:now,gender:now,event:now,status:now,afl2_opt:now,afl2:now};
    students.push(normStudent({id:nextId(),name,gender:draft.gender,seriesId:draft.seriesId,event:draft.event,status:draft.status,afl2_opt:draft.afl2_opt,afl2:afl2Val,ts}));
    curSeries=draft.seriesId;
  }
  dirty++;save();closeSheet();renderAll();toast(draft.id?'Élève modifié':'Élève ajouté');
}
function removeStudent(id){
  if(!confirm('Supprimer cet élève de l’évaluation ?'))return;
  students=students.filter(s=>s.id!==id);if(sel&&sel.id===id){sel=null;buf=''}
  save();closeSheet();renderAll();toast('Élève supprimé');
}

function openComment(id){
  const st=byId(id);if(!st)return;
  openSheet('Commentaire — '+st.name,`<div class="field"><textarea id="f-com" class="inp" rows="5" placeholder="Blessure, remarque jury, motif de dispense…">${esc(st.com)}</textarea></div>
    <div class="row2"><button class="btn sec" onclick="saveComment(${id},true)">Effacer</button><button class="btn pri" onclick="saveComment(${id})">Enregistrer</button></div>`);
  setTimeout(()=>{const t=$('f-com');if(t)t.focus()},250);
}
function saveComment(id,clear){
  const st=byId(id);if(!st)return;
  const v=clear?'':$('f-com').value.trim();
  closeSheet();setField(st,'com',v);
}

function openSeries(){
  openSheet('Séries de départ',`<p class="hint">Modifiez les noms des créneaux horaires ou supprimez une série (les élèves seront basculés vers la première série restante).</p>
  <div id="series-rows"></div>
  <div class="srow" style="margin-top:12px"><input id="new-series" class="inp" placeholder="Nouvelle série (ex : Série 6 · 15h30)"><button class="btn pri" style="width:auto;padding:0 18px;height:42px" onclick="addSeries()">${ic('plus',16)}</button></div>`);
  paintSeriesRows();
}
function paintSeriesRows(){
  $('series-rows').innerHTML=seriesList.map(s=>`<div class="srow"><input class="inp" value="${esc(s.name)}" onchange="renameSeries('${s.id}',this.value)"><button class="icon-btn" onclick="deleteSeries('${s.id}')">${ic('trash',17)}</button></div>`).join('');
}
function addSeries(){
  const inp=$('new-series'),name=inp.value.trim()||`Série ${seriesList.length+1}`;
  const id='s_'+Date.now();seriesList.push({id,name});inp.value='';save();paintSeriesRows();renderAll();toast('Série ajoutée');
}
function renameSeries(id,v){const s=seriesList.find(x=>x.id===id);if(s&&v.trim()){s.name=v.trim();save();renderAll()}}
function deleteSeries(id){
  if(seriesList.length<=1){toast('Il faut au moins une série');return}
  const n=students.filter(s=>s.seriesId===id).length;
  if(!confirm(`Supprimer cette série ? (${n} élève(s) seront basculés vers la première série)`))return;
  seriesList=seriesList.filter(s=>s.id!==id);
  students.forEach(s=>{if(s.seriesId===id)s.seriesId=seriesList[0].id});
  if(curSeries===id)curSeries=seriesList[0].id;
  sel=null;buf='';save();paintSeriesRows();renderAll();
}

function openBaremes(){
  const rows=[];
  for(let s=PERF_T0;s<=220;s++) {
    rows.push(`<tr><td>${s===PERF_T0?'≤ ':''}${fmt(s)}</td><td>${fr1(perfPoints(s,'G','C500')).replace(',0','')}</td><td>${fr1(perfPoints(s,'F','C500')).replace(',0','')}</td></tr>`);
  }
  const n=Math.ceil(rows.length/3);
  const tb=i=>`<table class="bt"><thead><tr><th>Meilleure course</th><th>Garçons</th><th>Filles</th></tr></thead><tbody>${rows.slice(i*n,(i+1)*n).join('')}</tbody></table>`;
  
  const regs=[];
  for(let e=0;e<=16;e++) {
    regs.push(`<span>${e<=3?'≤ 3':e===16?'≥ 15':e} s → <b>${e===16?0:regPoints(e)}</b></span>`);
  }

  openSheet('Barèmes — 3 × 500 m (Lycée Alain)',`
    <p class="hint"><b>AFL 1 /12</b> : moyenne de la Performance /12 (meilleure des 3 courses) et de la Régularité /12. <b>NOTE /20</b> = AFL 1 (/12) + Choix AFL 2 (4-4, 6-2 ou 2-2).</p>
    <div class="bgrid">${tb(0)}${tb(1)}${tb(2)}</div>
    <div class="sec-t">Régularité /12 — écart entre la course la plus lente et la plus rapide</div>
    <div class="regs">${regs.join('')}</div>`,true);
}

function openImport(){
  openSheet('Importer une liste',`<p class="hint">Collez la liste depuis votre tableur Excel (Nom, Sexe, Épreuve, Série, Choix AFL2). Format : <code class="bg-slate-100 text-sky-800 px-1 py-0.5 rounded">DUPONT Jean [F/G] [C500/C250/M250] [Série 1 · 9h] [4-4/6-2/2-2]</code></p>
  <div class="field"><textarea id="import-text" class="inp" rows="8" style="font-family:var(--mono);font-size:13px" placeholder="DUPONT Alice	F	C500	Série 1 · 9h	4-4&#10;MARTIN Lucas	G	C500	Série 1 · 9h	6-2&#10;BERNARD Emma	F	C250	Série 2 · 10h	2-2"></textarea></div>
  <button class="btn pri" onclick="processImport()">Ajouter à « ${esc(serName(curSeries))} »</button>`);
}
function processImport(){
  const lines=$('import-text').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  let added=0,skipped=0;
  lines.forEach(line=>{
    let cells=line.includes('	')?line.split('	'):(line.includes(';')?line.split(';'):line.split(/\s{2,}/));
    cells=cells.map(x=>x.trim()).filter(Boolean);
    if(cells.length<2)cells=line.split(/\s+/);
    let gender='G',event='C500',seriesId=curSeries,afl2_opt='4-4',nameParts=[];
    cells.forEach(c=>{
      if(/^(F|FILLE|FILLES)$/i.test(c))gender='F';
      else if(/^(G|M|H|GARCON|GARÇON|GARCONS|GARÇONS)$/i.test(c))gender='G';
      else if(/^(C500|C250|M250)$/i.test(c))event=c.toUpperCase();
      else if(/^(4-4|6-2|2-2)$/i.test(c))afl2_opt=c;
      else {
        let fSer=seriesList.find(s=>norm(s.name)===norm(c));
        if(fSer)seriesId=fSer.id;
        else if(!/^\d{1,3}$/.test(c)) nameParts.push(c);
      }
    });
    const name=nameParts.join(' ').replace(/^[\s"']+|[\s"']+$/g,'');
    if(!name){skipped++;return}
    if(students.some(s=>norm(s.name)===norm(name)&&s.seriesId===seriesId)){skipped++;return}
    const now=Date.now();
    students.push(normStudent({id:nextId(),name,gender,seriesId,event,afl2_opt,ts:{name:now,gender:now,event:now,afl2_opt:now}}));added++;
  });
  dirty++;save();closeSheet();renderAll();
  toast(`${added} élève(s) ajouté(s)${skipped?` · ${skipped} ignoré(s)`:''}`);
}

const startCCFApp = () => {
  applyPrefs();
  paintIcons();
  
  // 1. Initialisation locale immédiate garantie pour avoir toujours les séries et boutons au chargement
  seed();
  fixData();
  renderAll();

  // 2. Connexion Firebase en arrière-plan (sans bloquer ni effacer si cloud vide)
  if(window.initFirebaseSync){
    window.initFirebaseSync((remoteStudents, remoteSeries)=>{
      if(remoteStudents && remoteSeries && remoteSeries.length > 0){
        students = remoteStudents.map(normStudent);
        seriesList = remoteSeries;
        fixData();
        renderAll();
      }
    });
  }
};
window.addEventListener('DOMContentLoaded',()=>{
  if (window.__teacherAccessGranted) startCCFApp();
  else window.addEventListener('teacher-access-granted', startCCFApp, {once:true});
});
</script>
