<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c4a6e">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>CCF Demi-fond · Lycée Alain 2026</title>
<style>
:root{
  --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8; --line:#e2e8f0; --bg:#f1f5f9; --card:#fff;
  --brand:#0369a1; --brand2:#0ea5e9; --indigo:#6366f1;
  --ok:#059669; --okbg:#d1fae5; --mid:#0284c7; --midbg:#e0f2fe; --low:#d97706; --lowbg:#fef3c7; --bad:#dc2626;
  --r:18px; --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px -8px rgba(15,23,42,.12);
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
svg{display:block;flex-shrink:0}

/* ---------- HERO ---------- */
.hero{background:linear-gradient(135deg,#082f49 0%,#0369a1 55%,#6366f1 120%);color:#fff;padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 18px max(16px,env(safe-area-inset-left));position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%)}
.hero-top{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.logo{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);display:grid;place-items:center;backdrop-filter:blur(6px)}
.titles{flex:1;min-width:0}
.titles h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.titles p{margin:2px 0 0;font-size:12.5px;opacity:.8;font-weight:500}
.hbtns{display:flex;gap:8px}
.hbtn{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;color:#fff;backdrop-filter:blur(6px);transition:.15s}
.hbtn:active{transform:scale(.94);background:rgba(255,255,255,.26)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:10px 12px;backdrop-filter:blur(8px)}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;opacity:.78;font-weight:700}
.stat .v{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;font-weight:600;opacity:.75}
.prog{height:5px;border-radius:9px;background:rgba(255,255,255,.2);margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:#6ee7b7;border-radius:9px;transition:width .4s}

/* ---------- TOOLBAR ---------- */
.toolbar{position:sticky;top:0;z-index:30;background:rgba(241,245,249,.88);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left))}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.search input{width:100%;height:44px;border-radius:14px;border:1px solid var(--line);background:#fff;padding:0 14px 0 42px;font-size:16px;outline:none;transition:.15s;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.search input:focus{border-color:var(--brand2);box-shadow:0 0 0 4px rgba(14,165,233,.15)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:9px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink2);transition:.15s;white-space:nowrap}
.chip b{font-size:12px;background:var(--bg);border-radius:99px;padding:1px 8px;color:var(--ink2);font-weight:700}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 4px 12px -4px rgba(15,23,42,.5)}
.chip.on b{background:rgba(255,255,255,.2);color:#fff}
.chip.ev.on{background:var(--brand);border-color:var(--brand)}
.chips.sm .chip{height:32px;font-size:13px;padding:0 12px}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:0 2px;align-self:center;flex:none}

/* ---------- LISTE / CARTES ---------- */
main{padding:14px max(16px,env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));max-width:1280px;margin:0 auto}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid rgba(226,232,240,.7);padding:14px;position:relative;overflow:hidden;animation:pop .28s ease both}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line);transition:.3s}
.card[data-state=done]::before{background:linear-gradient(var(--ok),#34d399)}
.card[data-state=part]::before{background:linear-gradient(var(--low),#fbbf24)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card-top{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;letter-spacing:.02em}
.avatar.g{background:linear-gradient(135deg,#e0f2fe,#bae6fd);color:#0369a1}
.avatar.f{background:linear-gradient(135deg,#fce7f3,#fbcfe8);color:#be185d}
.who{flex:1;min-width:0}
.name{font-weight:800;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.pill{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.ev-C500{background:var(--midbg);color:#075985}
.pill.ev-C250{background:var(--okbg);color:#065f46}
.pill.ev-M250{background:var(--lowbg);color:#92400e}
.pill.ser{background:#eef2ff;color:#4338ca;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink3);transition:.15s}
.icon-btn:active{background:var(--bg);color:var(--ink)}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.tf{display:flex;flex-direction:column;gap:4px}
.tf span{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);text-align:center}
.tf.ann span{color:var(--brand)}
.tin{width:100%;height:50px;border-radius:13px;border:1.5px solid var(--line);background:#f8fafc;text-align:center;font-family:var(--mono);font-size:18px;font-weight:700;outline:none;transition:.15s;padding:0 2px;min-width:0}
.tf.ann .tin{background:#f0f9ff;border-color:#bae6fd}
.tin:focus{background:#fff;border-color:var(--brand2);box-shadow:0 0 0 4px rgba(14,165,233,.16)}
.tin.bad{border-color:var(--bad);background:#fef2f2;color:var(--bad)}
.tin::placeholder{color:#cbd5e1;font-weight:500}
.res{display:flex;align-items:stretch;gap:10px;margin-top:12px}
.mini{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.m{background:#f8fafc;border-radius:11px;padding:6px 9px;display:flex;justify-content:space-between;align-items:baseline;gap:6px;min-width:0}
.m span{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3)}
.m b{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.m small{font-weight:500;color:var(--ink3);font-size:10.5px}
.note{width:88px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;background:var(--bg);color:var(--ink3);transition:.25s}
.note b{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.note small{font-size:11px;font-weight:700;opacity:.8;margin-top:2px}
.note.hi{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 8px 18px -8px #059669}
.note.mid{background:linear-gradient(135deg,#38bdf8,#0284c7);color:#fff;box-shadow:0 8px 18px -8px #0284c7}
.note.lo{background:linear-gradient(135deg,#fbbf24,#d97706);color:#fff;box-shadow:0 8px 18px -8px #d97706}
.empty{grid-column:1/-1;text-align:center;padding:48px 20px;color:var(--ink2)}
.empty .big{font-size:44px}
.empty h3{margin:8px 0 4px;color:var(--ink)}

/* ---------- FAB ---------- */
.fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));z-index:40;height:58px;padding:0 22px 0 18px;border-radius:99px;background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;box-shadow:0 14px 28px -10px rgba(3,105,161,.8);transition:.15s}
.fab:active{transform:scale(.95)}

/* ---------- FEUILLES (MODALES) ---------- */
#overlay{position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center}
#overlay.show{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;max-height:92dvh;border-radius:26px 26px 0 0;display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.sheet.wide{max-width:820px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:9px auto 0;flex:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 8px;flex:none}
.sheet-h h2{margin:0;font-size:19px;letter-spacing:-.02em}
.sheet-b{padding:6px 18px calc(20px + env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch}
@media(min-width:700px){#overlay{align-items:center}.sheet{border-radius:26px;max-height:88vh}}
.field{margin-bottom:14px}
.field>label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin-bottom:6px}
.inp,.sel{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--line);background:#f8fafc;padding:0 14px;font-size:16px;outline:none}
.inp:focus,.sel:focus{border-color:var(--brand2);background:#fff;box-shadow:0 0 0 4px rgba(14,165,233,.15)}
textarea.inp{height:auto;padding:12px 14px;font-family:var(--mono);font-size:14px;line-height:1.5}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;height:42px;border-radius:11px;font-weight:700;font-size:14.5px;color:var(--ink2);transition:.15s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(15,23,42,.12)}
.btn{height:52px;border-radius:15px;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:9px;width:100%;transition:.15s}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;box-shadow:0 10px 22px -10px var(--brand)}
.btn.sec{background:var(--bg);color:var(--ink)}
.btn.dan{background:#fef2f2;color:var(--bad)}
.btn.xl{background:linear-gradient(135deg,#10b981,#047857);color:#fff;box-shadow:0 10px 22px -10px #047857}
.btn.pdf{background:linear-gradient(135deg,#f43f5e,#be123c);color:#fff;box-shadow:0 10px 22px -10px #be123c}
.stack{display:flex;flex-direction:column;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu-i{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 12px;border-radius:16px;transition:.12s}
.menu-i:active{background:var(--bg)}
.menu-i .ib{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--midbg);color:var(--brand);flex:none}
.menu-i b{display:block;font-size:15.5px}
.menu-i small{color:var(--ink2);font-size:13px}
.hint{font-size:13px;color:var(--ink2);line-height:1.45;margin:0 0 12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.kpi{border-radius:14px;padding:10px 12px;background:var(--bg)}
.kpi small{display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.kpi b{font-size:24px;letter-spacing:-.02em}
.sec-t{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);margin:16px 0 8px}
.bar-r{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:14px}
.bar-r .n{width:44%;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-r .tr{flex:1;height:10px;background:var(--bg);border-radius:9px;overflow:hidden}
.bar-r .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--indigo));border-radius:9px}
.bar-r .v{width:50px;text-align:right;font-family:var(--mono);font-weight:800}
.rank{width:100%;border-collapse:collapse;font-size:14px}
.rank td{padding:9px 6px;border-bottom:1px solid var(--line)}
.rank .p{width:34px;font-weight:800;color:var(--ink3)}
.rank .sc{text-align:right;font-family:var(--mono);font-weight:800;color:var(--brand)}
.medal{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:13px}
.bt{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:14px}
.bt th{position:sticky;top:0;background:#fff;text-align:left;font-family:var(--sans);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);padding:8px 6px;border-bottom:2px solid var(--line)}
.bt td{padding:8px 6px;border-bottom:1px solid #f1f5f9}
.bt td:first-child{font-weight:800;color:var(--brand)}
.bt td:last-child{color:#be185d}
.srow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.srow .inp{height:46px}
.srow .icon-btn{background:var(--bg);flex:none}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14.5px;z-index:200;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;box-shadow:0 14px 30px -10px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- RAPPORT IMPRIMABLE / PDF ---------- */
#print-report{display:none;font-family:var(--sans);color:#0f172a}
.pr-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #0369a1;padding-bottom:10px;margin-bottom:12px}
.pr-head h1{margin:0;font-size:22px;color:#0c4a6e;letter-spacing:-.01em}
.pr-head p{margin:3px 0 0;font-size:12px;color:#475569}
.pr-meta{text-align:right;font-size:12px;line-height:1.6}
.pr-kpis{display:flex;gap:10px;margin-bottom:14px}
.pr-kpis div{flex:1;background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;padding:6px 10px;font-size:11px;color:#075985}
.pr-kpis b{display:block;font-size:17px;color:#0c4a6e}
.pr-ser{margin:14px 0 6px;font-size:13px;font-weight:800;color:#fff;background:#0369a1;padding:5px 10px;border-radius:6px;display:flex;justify-content:space-between;break-after:avoid}
.pr-t{width:100%;border-collapse:collapse;font-size:10.5px;margin-bottom:6px}
.pr-t th{background:#e0f2fe;color:#0c4a6e;font-weight:800;padding:5px 4px;border:1px solid #cbd5e1;text-align:center;font-size:9.5px}
.pr-t td{padding:4px 5px;border:1px solid #cbd5e1;text-align:center}
.pr-t td.l{text-align:left;font-weight:700}
.pr-t tr{break-inside:avoid}
.pr-t tbody tr:nth-child(even){background:#f8fafc}
.pr-t td.cu{background:#f1f5f9;font-weight:700}
.pr-t td.nt{font-weight:800;font-size:12px}
.pr-t td.nt.hi{background:#d1fae5;color:#065f46}.pr-t td.nt.mid{background:#dbeafe;color:#1e40af}.pr-t td.nt.lo{background:#fef3c7;color:#92400e}
.pr-sign{margin-top:26px;display:flex;justify-content:space-between;font-size:12px;color:#475569;break-inside:avoid}
.pr-sign div{width:44%;border-top:1px solid #94a3b8;padding-top:5px}
.pr-foot{margin-top:10px;font-size:9px;color:#94a3b8;text-align:center}
@media print{
  @page{size:A4 landscape;margin:10mm}
  html,body{background:#fff!important}
  #app,.fab,#overlay,#toast{display:none!important}
  #print-report{display:block}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(max-width:520px){
  .titles h1{font-size:17px}
  .kpis{grid-template-columns:1fr 1fr}
  #list{grid-template-columns:1fr}
  .fab span{display:none}.fab{padding:0 18px;width:58px;justify-content:center}
}
</style>
</head>
<body>
<div id="app">
  <header class="hero">
    <div class="hero-top">
      <div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="4.5" r="2"/><path d="M11 9l-3 4 3 2 1 5M11 9l4 2 3-1M8 13l-3 1"/></svg></div>
      <div class="titles"><h1>Lycée Alain · CCF Demi-fond</h1><p>Baccalauréat EPS · Session 2026</p></div>
      <div class="hbtns">
        <button class="hbtn" onclick="openDashboard()" title="Bilan" data-ic="chart"></button>
        <button class="hbtn" onclick="openExport()" title="Exporter" data-ic="download"></button>
        <button class="hbtn" onclick="openMenu()" title="Menu" data-ic="menu"></button>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">Élèves</div><div class="v" id="st-total">0</div></div>
      <div class="stat"><div class="k">Notés</div><div class="v"><span id="st-done">0</span><small id="st-of">/0</small></div><div class="prog"><i id="st-bar"></i></div></div>
      <div class="stat"><div class="k">Moyenne</div><div class="v"><span id="st-avg">–</span><small>/20</small></div></div>
    </div>
  </header>

  <div class="toolbar">
    <div class="search"><span data-ic="search"></span><input id="q" type="search" placeholder="Rechercher un élève…" oninput="renderList()" autocomplete="off"></div>
    <div class="chips" id="series-chips"></div>
    <div class="chips sm" id="event-chips"></div>
  </div>

  <main><div id="list"></div></main>
  <button class="fab" onclick="openStudentSheet(null)"><span data-ic="plus" data-s="24" style="display:contents"></span><span>Élève</span></button>
</div>

<div id="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"><div class="grab"></div><div class="sheet-h"><h2 id="sheet-t"></h2><button class="icon-btn" onclick="closeSheet()" data-ic="x"></button></div><div class="sheet-b" id="sheet-b"></div></div></div>
<div id="print-report"></div>
<div id="toast"></div>
<input id="backup-file" type="file" accept=".json,application/json" hidden onchange="importBackup(event)">

<script>
// ================= ICÔNES =================
const IC={
  chart:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
  download:'<path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/>',
  menu:'<circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',

// ================= SAISIE RAPIDE : 142 -> 1'42" =================
function parseTime(input){
  if(input===null||input===undefined)return null;
  let s=String(input).trim().replace(/["”″]/g,'').replace(/\s+/g,'');
  if(!s)return null;
  let v=null,m=s.match(/^(\d+)[':m.,h](\d{1,2})$/i);
  if(m){const sec=+m[2];v=sec<60?(+m[1])*60+sec:null}
  else if(/^\d{3,4}$/.test(s)){const min=+s.slice(0,-2),sec=+s.slice(-2);v=sec<60?min*60+sec:null}
  else if(/^\d{1,2}$/.test(s))v=+s;
  return v&&v>0?v:null;
}
function fmt(t){
  if(t===null||t===undefined||isNaN(t)||t<=0)return '--';
  const m=Math.floor(t/60),s=t%60;
  return m===0?`${s}"`:`${m}'${String(s).padStart(2,'0')}"`;
}

// ================= CALCUL DE LA NOTE /20 =================
function calc(st){
  const t1=parseTime(st.t1),t2=parseTime(st.t2),t3=parseTime(st.t3),ann=parseTime(st.ann1);
  const isComplete=t1!==null&&t2!==null&&t3!==null;
  const cumul=isComplete?t1+t2+t3:null;
  let notePerf=0;
  if(cumul!==null){
    const grid=BAREMES[st.event]||BAREME_M250, ci=st.gender==='G'?1:2;
    for(const r of grid){if(cumul<=r[ci]){notePerf=r[0];break}}
  }
  let noteProj=0,ecartC1=null;
  if(ann!==null&&t1!==null){
    ecartC1=Math.abs(t1-ann);
    noteProj=ecartC1<=1?6:ecartC1<=2?5:ecartC1<=3?4:ecartC1<=5?3:ecartC1<=7?2:ecartC1<=9?1:0;
  }
  let noteReg=0,ecartReg=null;
  if(isComplete){
    ecartReg=Math.max(t1,t2,t3)-Math.min(t1,t2,t3);
    noteReg=ecartReg<=2?4:ecartReg<=4?3:ecartReg<=6?2:ecartReg<=8?1:0;
  }
  const noteTotale=isComplete?notePerf+noteProj+noteReg:null;
  return {isComplete,cumul,notePerf,noteProj,ecartC1,noteReg,ecartReg,noteTotale,t1,t2,t3,ann};
}
const tier=n=>n===null?'':(n>=14?'hi':n>=10?'mid':'lo');

function onKey(e,el){

    e.preventDefault();

    if(i>=0&&i<all.length-1){all[i+1].focus();all[i+1].scrollIntoView({block:'center',behavior:'smooth'})}else el.blur();

}

function groupStats(keyFn){
  const g={};
  students.forEach(st=>{const k=keyFn(st);const o=(g[k]??={total:0,done:0,sum:0,min:null,max:null});o.total++;const r=calc(st);if(r.isComplete){o.done++;o.sum+=r.noteTotale;o.min=o.min===null?r.noteTotale:Math.min(o.min,r.noteTotale);o.max=o.max===null?r.noteTotale:Math.max(o.max,r.noteTotale)}});
  return g;
}

// ---- Import
function openImport(){
  openSheet('Importer une liste',`<p class="hint">Un élève par ligne. Format reconnu : <b>NOM Prénom</b> puis, si besoin, <b>F</b> ou <b>G</b>, <b>C500 / C250 / M250</b> et <b>Série 2</b>. Les doublons sont ignorés.</p>
  <div class="field"><textarea id="import-text" class="inp" rows="9" placeholder="DUPONT Alice F C500 Série 1&#10;MARTIN Lucas G C500 Série 1&#10;BERNARD Emma F M250 Série 2"></textarea></div>
  <button class="btn pri" onclick="processImport()">Ajouter à la liste</button>`);
}
function processImport(){
  const lines=$('import-text').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  let nextId=students.length?Math.max(...students.map(s=>Number(s.id)||0))+1:1,added=0,skipped=0;
  const defaultSeries=curSeries!=='ALL'?curSeries:seriesList[0].id;
  lines.forEach(line=>{
    const parts=line.includes('\t')?line.split('\t').map(x=>x.trim()).filter(Boolean):(line.includes(';')?line.split(';').map(x=>x.trim()).filter(Boolean):line.split(/\s{2,}/).map(x=>x.trim()).filter(Boolean));
    const tokens=parts.length>1?parts.join(' ').split(/\s+/):line.split(/\s+/);
    const gi=tokens.findIndex(t=>/^(F|FILLE|FILLES|G|GARCON|GARÇON|GARCONS|GARÇONS)$/i.test(t));
    const ei=tokens.findIndex(t=>/^(C500|C250|M250)$/i.test(t));
    const si=tokens.findIndex(t=>/^s[ée]rie$/i.test(t));
    const gender=gi>=0&&/^F/i.test(tokens[gi])?'F':'G';
    const event=ei>=0?tokens[ei].toUpperCase():'C500';
    let nameEnd=Math.min(...[gi,ei,si].filter(i=>i>=0));if(!Number.isFinite(nameEnd))nameEnd=tokens.length;
    let name=tokens.slice(0,nameEnd).join(' ').replace(/^[\s"']+|[\s"']+$/g,'').trim();
    if(!name&&parts.length>1)name=parts[0];
    if(!name){skipped++;return}
    let ser=defaultSeries;
    if(si>=0&&tokens[si+1]){
      const lab=`série ${tokens[si+1]}`.toLowerCase();
      const f=seriesList.find(s=>s.name.toLowerCase().includes(lab)||s.name.toLowerCase().includes(`serie ${tokens[si+1]}`.toLowerCase()));
      if(f)ser=f.id;
    }
    if(students.some(s=>s.name.trim().toLowerCase()===name.toLowerCase()&&s.seriesId===ser&&s.event===event)){skipped++;return}
    students.push({id:nextId++,name,gender,seriesId:ser,event,ann1:'',t1:'',t2:'',t3:''});added++;
  });
  save();closeSheet();renderAll();
  toast(`${added} élève(s) ajouté(s)${skipped?` · ${skipped} ignoré(s)`:''}`);
}

function downloadBlob(blob,filename){
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

function importBackup(ev){
  const file=ev.target.files&&ev.target.files[0];if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!Array.isArray(d.students)||!Array.isArray(d.seriesList)||!d.seriesList.length)throw new Error('format');
      if(!confirm(`Remplacer les données actuelles par la sauvegarde (${d.students.length} élève(s), ${d.seriesList.length} série(s)) ?`))return;
      students=d.students;seriesList=d.seriesList;curSeries='ALL';curEvent='ALL';save();renderAll();toast('Sauvegarde restaurée');
    }catch(e){alert('Fichier illisible : choisissez une sauvegarde .json créée par cette application.')}
    finally{ev.target.value=''}
  };
  rd.readAsText(file);
}

function crc32(buf){
  if(!crc32.t){crc32.t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;crc32.t[n]=c>>>0}}
  let crc=0xFFFFFFFF;for(let i=0;i<buf.length;i++)crc=crc32.t[(crc^buf[i])&255]^(crc>>>8);
  return (crc^0xFFFFFFFF)>>>0;
}
function zipStore(files){
  const enc=new TextEncoder(),out=[],central=[];let off=0;
  const u16=v=>[v&255,(v>>8)&255],u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  files.forEach(f=>{
    const nm=enc.encode(f.name),d=enc.encode(f.data),crc=crc32(d);
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(d.length),...u32(d.length),...u16(nm.length),...u16(0)]);
    out.push(lh,nm,d);
    central.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(d.length),...u32(d.length),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);
    off+=lh.length+nm.length+d.length;
  });
  const csize=central.reduce((a,c)=>a+c.length,0);
  const end=new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(csize),...u32(off),...u16(0)]);
  const all=[...out,...central,end],total=all.reduce((a,c)=>a+c.length,0),res=new Uint8Array(total);
  let p=0;all.forEach(c=>{res.set(c,p);p+=c.length});return res;
}
const XE=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
const colL=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
function xCell(r,c,v,s){
  const ref=colL(c)+r;
  if(v===null||v===undefined||v==='')return `<c r="${ref}" s="${s}"/>`;
  if(typeof v==='number')return `<c r="${ref}" s="${s}"><v>${v}</v></c>`;
  if(typeof v==='object'&&v.f)return `<c r="${ref}" s="${s}"><f>${XE(v.f)}</f><v>${v.v}</v></c>`;
  return `<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${XE(v)}</t></is></c>`;
}

    rows.push({h:21,cells:[[i+1,8],[x.st.name,4],[x.st.gender,5],[serName(x.st.seriesId),4],[EV[x.st.event].label,5],
      [T(r.ann),6],[T(r.t1),6],[T(r.t2),6],[T(r.t3),6],[r.cumul?T(r.cumul):'',12],
      [r.isComplete?r.notePerf:'',7],[r.ecartC1!==null?r.noteProj:'',8],[r.isComplete?r.noteReg:'',8],[r.noteTotale!==null?r.noteTotale:'',noteStyle(r.noteTotale)]]});
  });
  const first=5,last=4+list.length;
  const merges=['A1:N1','A2:N2','A3:N3'];
  if(done.length){
    rows.push({h:6,cells:[]});
    const rr=rows.length+1;
    rows.push({h:22,cells:[...Array(12).fill(['',0]),['Moyenne',14],[{f:`AVERAGE(N${first}:N${last})`,v:avg},15]]});
  }
  const s1=xSheet({first:true,cols:[5,26,7,24,14,12,10,10,10,10,10,10,10,12],rows,merges,freeze:{x:2,y:4},filter:list.length?`A4:N${last}`:null});

  // Feuille 2 : synthèse
  const gs=(keyFn)=>{const g={};list.forEach(x=>{const k=keyFn(x.st);const o=(g[k]??={t:0,d:0,s:0,mn:null,mx:null});o.t++;if(x.r.isComplete){const n=x.r.noteTotale;o.d++;o.s+=n;o.mn=o.mn===null?n:Math.min(o.mn,n);o.mx=o.mx===null?n:Math.max(o.mx,n)}});return g};
  const block=(title,g,label)=>{
    const out=[{h:24,cells:[[title,13]]},{h:26,cells:[[label,3],['Inscrits',3],['Notés',3],['Moyenne /20',3],['Min',3],['Max',3]]}];
    Object.entries(g).forEach(([k,o])=>out.push({h:20,cells:[[k,14],[o.t,8],[o.d,8],[o.d?o.s/o.d:'',15],[o.mn===null?'':o.mn,7],[o.mx===null?'':o.mx,7]]}));
    out.push({h:12,cells:[]});return out;
  };
  const rows2=[{h:30,cells:[['Synthèse de l’évaluation',1]]},{h:20,cells:[[`Date : ${dateFR(meta.date)}   |   Examinateur : ${meta.examiner||'—'}`,2]]},{h:12,cells:[]},
    ...block('Par série',gs(s=>serName(s.seriesId)),'Série'),
    ...block('Par épreuve',gs(s=>EV[s.event].long),'Épreuve'),
    ...block('Filles / Garçons',gs(s=>s.gender==='F'?'Filles':'Garçons'),'Groupe')];
  const s2=xSheet({cols:[34,11,11,14,10,10],rows:rows2,merges:['A1:F1','A2:F2']});

  const nm=`'Résultats'!$A$4:$N$${Math.max(last,5)}`;
  const files=[
    {name:'[Content_Types].xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`},
    {name:'_rels/.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:'xl/workbook.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView activeTab="0"/></bookViews><sheets><sheet name="Résultats" sheetId="1" r:id="rId1"/><sheet name="Synthèse" sheetId="2" r:id="rId2"/></sheets>${list.length?`<definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="0" hidden="1">${XE(nm)}</definedName></definedNames>`:''}</workbook>`},
    {name:'xl/_rels/workbook.xml.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
    {name:'xl/styles.xml',data:XSTYLES},
    {name:'xl/worksheets/sheet1.xml',data:s1},
    {name:'xl/worksheets/sheet2.xml',data:s2}
  ];
  return zipStore(files);
}
function exportExcel(){
  readExportMeta();
  const bytes=buildXlsxBytes(expScope);
  downloadBlob(new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),fileBase()+'.xlsx');
  closeSheet();toast('Fichier Excel généré');
}

// ================= INIT =================
window.addEventListener('DOMContentLoaded',()=>{
  loadMeta();load();paintIcons();renderAll();
});
</script>
